name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect project type
        id: detect
        run: |
          if [ -f "package.json" ]; then
            echo "type=node" >> $GITHUB_OUTPUT
          elif [ -f "requirements.txt" ] || [ -f "pyproject.toml" ]; then
            echo "type=python" >> $GITHUB_OUTPUT
          elif [ -f "go.mod" ]; then
            echo "type=go" >> $GITHUB_OUTPUT
          else
            echo "type=generic" >> $GITHUB_OUTPUT
          fi

      - name: Set up Node.js
        if: steps.detect.outputs.type == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (Node)
        if: steps.detect.outputs.type == 'node'
        run: npm ci

      - name: Run lint (Node)
        if: steps.detect.outputs.type == 'node'
        run: npm run lint --if-present

      - name: Set up Python
        if: steps.detect.outputs.type == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install linter (Python)
        if: steps.detect.outputs.type == 'python'
        run: pip install ruff

      - name: Run lint (Python)
        if: steps.detect.outputs.type == 'python'
        run: ruff check .

      - name: Set up Go
        if: steps.detect.outputs.type == 'go'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run lint (Go)
        if: steps.detect.outputs.type == 'go'
        uses: golangci/golangci-lint-action@v6

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Detect project type
        id: detect
        run: |
          if [ -f "package.json" ]; then
            echo "type=node" >> $GITHUB_OUTPUT
          elif [ -f "requirements.txt" ] || [ -f "pyproject.toml" ]; then
            echo "type=python" >> $GITHUB_OUTPUT
          elif [ -f "go.mod" ]; then
            echo "type=go" >> $GITHUB_OUTPUT
          else
            echo "type=generic" >> $GITHUB_OUTPUT
          fi

      - name: Set up Node.js
        if: steps.detect.outputs.type == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (Node)
        if: steps.detect.outputs.type == 'node'
        run: npm ci

      - name: Run tests (Node)
        if: steps.detect.outputs.type == 'node'
        run: npm test --if-present

      - name: Set up Python
        if: steps.detect.outputs.type == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies (Python)
        if: steps.detect.outputs.type == 'python'
        run: pip install -r requirements.txt

      - name: Run tests (Python)
        if: steps.detect.outputs.type == 'python'
        run: python -m pytest

      - name: Set up Go
        if: steps.detect.outputs.type == 'go'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests (Go)
        if: steps.detect.outputs.type == 'go'
        run: go test ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Detect project type
        id: detect
        run: |
          if [ -f "package.json" ]; then
            echo "type=node" >> $GITHUB_OUTPUT
          elif [ -f "requirements.txt" ] || [ -f "pyproject.toml" ]; then
            echo "type=python" >> $GITHUB_OUTPUT
          elif [ -f "go.mod" ]; then
            echo "type=go" >> $GITHUB_OUTPUT
          else
            echo "type=generic" >> $GITHUB_OUTPUT
          fi

      - name: Set up Node.js
        if: steps.detect.outputs.type == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (Node)
        if: steps.detect.outputs.type == 'node'
        run: npm ci

      - name: Build (Node)
        if: steps.detect.outputs.type == 'node'
        run: npm run build --if-present

      - name: Set up Go
        if: steps.detect.outputs.type == 'go'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build (Go)
        if: steps.detect.outputs.type == 'go'
        run: go build ./...

      - name: Upload build artifacts
        if: steps.detect.outputs.type == 'node'
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: dist/
          if-no-files-found: ignore
          retention-days: 7
